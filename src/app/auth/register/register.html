<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Usuario</title>
  <link rel="stylesheet" href="register.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="register-container">
  <h2 class="register-title">Crear Cuenta</h2>
  <form class="register-form">

    <div class="input-group">
      <label for="name">Nombre Completo</label>
      <input type="text" id="name" name="name" required placeholder="Nombre y Apellido">
    </div>

    <div class="input-group">
      <label for="email">Correo Electrónico</label>
      <input type="email" id="email" name="email" required placeholder="ejemplo@dominio.com">
    </div>

    <div class="input-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required placeholder="Crea una contraseña">
    </div>

    <div class="input-group">
      <label for="confirm-password">Confirmar Contraseña</label>
      <input type="password" id="confirm-password" name="confirm-password" required placeholder="Repite la contraseña">
    </div>

    <button type="submit" class="btn-register">Registrarse</button>

    <div class="form-footer">
      <a href="../login/login.html" class="login-link">¿Ya tienes cuenta? Inicia Sesión</a>
    </div>
  </form>
</div>
</body>
</html>
