<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesión Elegante</title>
  <link rel="stylesheet" href="login.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="login-container">
  <h2 class="login-title">Acceso al Sistema</h2>
  <form class="login-form">
    <div class="input-group">
      <label for="email">Correo Electrónico</label>
      <input type="email" id="email" name="email" required placeholder="ejemplo@dominio.com">
    </div>
    <div class="input-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required placeholder="••••••••">
    </div>

    <button type="submit" class="btn-login">Iniciar Sesión</button>

    <div class="form-footer">
      <a href="../register/register.html" class="register-link">¿No tienes cuenta? Regístrate</a>
    </div>
  </form>
</div>
</body>
</html>
