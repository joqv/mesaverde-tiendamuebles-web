

<div class="min-h-screen bg-gray-50 p-6">
  <div class="max-w-6xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-800 mb-8 text-center">Catálogo de Productos</h1>

    <div class="flex justify-end mb-4">
      <button class="bg-green-500 hover:bg-green-600 text-white text-sm px-4 py-2 rounded">
        Añadir al carrito
      </button>
    </div>


    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
      <div *ngFor="let producto of productos" class="bg-white rounded-lg shadow hover:shadow-lg transition p-4 flex flex-col items-center">
        <img src="assets/img/{{ producto.imagen }}" alt="{{ producto.nombre }}" class="w-full h-40 object-cover rounded mb-3" />
        <h3 class="text-base font-semibold text-gray-700 text-center">{{ producto.nombre }}</h3>
        <p class="text-sm text-gray-500 mb-2">ID: {{ producto.id }}</p>

        <label class="flex items-center mb-2">
          <input type="checkbox" class="mr-2 accent-green-600" />
          <span class="text-sm text-gray-700">Seleccionar</span>
        </label>

      </div>
    </div>
  </div>
</div>
